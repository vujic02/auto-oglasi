<!DOCTYPE html>
<html lang="sr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Marka')}"></head>
<body class="flex min-h-screen flex-col bg-gray-50">
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="flex-1">
    <div class="mx-auto max-w-lg px-4 py-8">
        <h1 class="mb-6 text-2xl font-bold text-gray-900"
            th:text="${editMode} ? 'Izmena marke' : 'Nova marka'">Marka</h1>

        <form th:action="${editMode} ? @{/admin/brands/{id}/edit(id=${brand.id})} : @{/admin/brands}"
              method="post" class="card space-y-4 p-6">
            <div>
                <label class="label">Naziv *</label>
                <input type="text" name="name" th:value="${brand.name}" class="input" required/>
            </div>
            <div>
                <label class="label">Zemlja porekla</label>
                <input type="text" name="countryOfOrigin" th:value="${brand.countryOfOrigin}" class="input"/>
            </div>
            <div class="flex gap-2 border-t border-gray-100 pt-4">
                <button type="submit" class="btn-primary">Sačuvaj</button>
                <a th:href="@{/admin/brands}" class="btn-secondary">Otkaži</a>
            </div>
        </form>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
