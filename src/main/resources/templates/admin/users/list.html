<!DOCTYPE html>
<html lang="sr" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Korisnici')}"></head>
<body class="flex min-h-screen flex-col bg-gray-50">
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="flex-1">
    <div th:replace="~{fragments/layout :: flash}"></div>
    <div class="mx-auto max-w-5xl px-4 py-8">
        <h1 class="mb-6 text-2xl font-bold text-gray-900">Korisnici</h1>

        <div class="card overflow-hidden">
            <table class="w-full text-left text-sm">
                <thead class="bg-gray-50 text-gray-600">
                    <tr>
                        <th class="px-4 py-3">Korisničko ime</th>
                        <th class="px-4 py-3">Email</th>
                        <th class="px-4 py-3">Role</th>
                        <th class="px-4 py-3">Status</th>
                        <th class="px-4 py-3 text-right">Akcije</th>
                    </tr>
                </thead>
                <tbody class="divide-y divide-gray-100">
                    <tr th:each="u : ${users}">
                        <td class="px-4 py-3 font-medium text-gray-900" th:text="${u.username}">user</td>
                        <td class="px-4 py-3 text-gray-600" th:text="${u.email}">email</td>
                        <td class="px-4 py-3">
                            <span th:each="r : ${u.roles}" class="badge mr-1" th:text="${r.name}">ROLE</span>
                        </td>
                        <td class="px-4 py-3">
                            <span class="badge" th:classappend="${u.enabled} ? 'bg-green-50 text-green-700' : 'bg-red-50 text-red-700'"
                                  th:text="${u.enabled} ? 'Aktivan' : 'Blokiran'">status</span>
                        </td>
                        <td class="px-4 py-3">
                            <div class="flex justify-end gap-2">
                                <form th:action="@{/admin/users/{id}/toggle(id=${u.id})}" method="post">
                                    <button type="submit" class="btn-secondary"
                                            th:text="${u.enabled} ? 'Blokiraj' : 'Aktiviraj'">Toggle</button>
                                </form>
                                <form th:action="@{/admin/users/{id}/delete(id=${u.id})}" method="post"
                                      th:if="${u.username != #authentication.name}"
                                      onsubmit="return confirm('Obrisati korisnika i sve njegove oglase?');">
                                    <button type="submit" class="btn-danger">Obriši</button>
                                </form>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
        <a th:href="@{/admin}" class="mt-4 inline-block text-sm text-brand-700 hover:underline">&larr; Nazad na admin panel</a>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
