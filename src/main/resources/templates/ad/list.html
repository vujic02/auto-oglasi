<!DOCTYPE html>
<html lang="sr" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Oglasi')}"></head>
<body class="flex min-h-screen flex-col bg-gray-50">
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="flex-1">
    <div th:replace="~{fragments/layout :: flash}"></div>

    <!-- Hero -->
    <section class="bg-brand-700 text-white">
        <div class="mx-auto max-w-6xl px-4 py-10">
            <h1 class="text-3xl font-bold">Pronađi svoj sledeći automobil</h1>
            <p class="mt-2 text-brand-100">Hiljade oglasa na jednom mestu.</p>
        </div>
    </section>

    <div class="mx-auto max-w-6xl px-4 py-8">

        <!-- ===== Filter / pretraga ===== -->
        <form th:action="@{/}" method="get" class="card mb-8 grid grid-cols-1 gap-4 p-4 md:grid-cols-6">
            <div class="md:col-span-2">
                <label class="label">Pretraga</label>
                <input type="text" name="q" th:value="${q}" placeholder="npr. BMW 320d" class="input"/>
            </div>
            <div>
                <label class="label">Marka</label>
                <select name="brandId" class="input">
                    <option value="">Sve marke</option>
                    <option th:each="b : ${brands}" th:value="${b.id}" th:text="${b.name}"
                            th:selected="${brandId != null and brandId == b.id}"></option>
                </select>
            </div>
            <div>
                <label class="label">Gorivo</label>
                <select name="fuelType" class="input">
                    <option value="">Svako</option>
                    <option th:each="f : ${fuelTypes}" th:value="${f.name()}" th:text="${f.displayName}"
                            th:selected="${fuelType != null and fuelType == f.name()}"></option>
                </select>
            </div>
            <div>
                <label class="label">Cena od (€)</label>
                <input type="number" name="minPrice" th:value="${minPrice}" min="0" class="input"/>
            </div>
            <div>
                <label class="label">Cena do (€)</label>
                <input type="number" name="maxPrice" th:value="${maxPrice}" min="0" class="input"/>
            </div>
            <div class="flex items-end gap-2 md:col-span-6">
                <button type="submit" class="btn-primary">Pretraži</button>
                <a th:href="@{/}" class="btn-secondary">Poništi filtere</a>
            </div>
        </form>

        <!-- ===== Rezultati ===== -->
        <div class="mb-4 flex items-center justify-between">
            <h2 class="text-lg font-semibold text-gray-800">
                Rezultati: <span th:text="${ads.totalElements}">0</span>
            </h2>
        </div>

        <div th:if="${ads.isEmpty()}" class="card p-8 text-center text-gray-500">
            Nema oglasa koji odgovaraju filterima.
        </div>

        <div class="grid grid-cols-1 gap-6 sm:grid-cols-2 lg:grid-cols-3">
            <a th:each="ad : ${ads.content}" th:href="@{/ads/{id}(id=${ad.id})}"
               class="card overflow-hidden transition hover:shadow-md">
                <div class="h-44 w-full bg-gray-100">
                    <img th:if="${ad.imageUrl}" th:src="${ad.imageUrl}" th:alt="${ad.title}"
                         class="h-44 w-full object-cover"/>
                    <div th:unless="${ad.imageUrl}" class="flex h-44 items-center justify-center text-4xl text-gray-300">🚗</div>
                </div>
                <div class="p-4">
                    <div class="flex items-start justify-between gap-2">
                        <h3 class="font-semibold text-gray-900" th:text="${ad.title}">Naslov</h3>
                        <span th:if="${ad.status.name() == 'PRODAT'}" class="badge bg-red-50 text-red-700">Prodat</span>
                    </div>
                    <p class="mt-1 text-sm text-gray-500" th:text="${ad.carModel.fullName}">Marka Model</p>
                    <p class="mt-2 text-xl font-bold text-brand-700">
                        <span th:text="${#numbers.formatInteger(ad.price, 1, 'POINT')}">0</span> €
                    </p>
                    <div class="mt-3 flex flex-wrap gap-2 text-xs text-gray-600">
                        <span class="badge" th:text="${ad.year}">2020</span>
                        <span class="badge" th:text="${#numbers.formatInteger(ad.mileage, 1, 'POINT')} + ' km'">km</span>
                        <span class="badge" th:text="${ad.fuelType.displayName}">Gorivo</span>
                        <span class="badge" th:text="${ad.city.name}">Grad</span>
                    </div>
                </div>
            </a>
        </div>

        <!-- ===== Paginacija ===== -->
        <div th:if="${ads.totalPages > 1}" class="mt-8 flex justify-center gap-2">
            <a th:if="${ads.hasPrevious()}"
               th:href="@{/(q=${q}, brandId=${brandId}, fuelType=${fuelType}, minPrice=${minPrice}, maxPrice=${maxPrice}, page=${ads.number - 1})}"
               class="btn-secondary">&larr; Prethodna</a>
            <span class="btn inline-flex items-center text-gray-600">
                Strana <span class="mx-1 font-semibold" th:text="${ads.number + 1}">1</span> / <span th:text="${ads.totalPages}">1</span>
            </span>
            <a th:if="${ads.hasNext()}"
               th:href="@{/(q=${q}, brandId=${brandId}, fuelType=${fuelType}, minPrice=${minPrice}, maxPrice=${maxPrice}, page=${ads.number + 1})}"
               class="btn-secondary">Sledeća &rarr;</a>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
