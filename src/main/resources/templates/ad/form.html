<!DOCTYPE html>
<html lang="sr" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${editMode} ? 'Izmena oglasa' : 'Novi oglas')}"></head>
<body class="flex min-h-screen flex-col bg-gray-50">
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="flex-1">
    <div class="mx-auto max-w-3xl px-4 py-8">
        <h1 class="mb-6 text-2xl font-bold text-gray-900"
            th:text="${editMode} ? 'Izmena oglasa' : 'Novi oglas'">Oglas</h1>

        <form th:action="${editMode} ? @{/ads/{id}/edit(id=${adId})} : @{/ads}"
              th:object="${advertisementForm}" method="post" class="card space-y-5 p-6">

            <div>
                <label class="label">Naslov *</label>
                <input type="text" th:field="*{title}" class="input"/>
                <p class="form-error" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></p>
            </div>

            <div class="grid grid-cols-1 gap-4 md:grid-cols-2">
                <div>
                    <label class="label">Marka i model *</label>
                    <select th:field="*{carModelId}" class="input">
                        <option value="">-- izaberi --</option>
                        <option th:each="m : ${models}" th:value="${m.id}" th:text="${m.fullName}"></option>
                    </select>
                    <p class="form-error" th:if="${#fields.hasErrors('carModelId')}" th:errors="*{carModelId}"></p>
                </div>
                <div>
                    <label class="label">Grad *</label>
                    <select th:field="*{cityId}" class="input">
                        <option value="">-- izaberi --</option>
                        <option th:each="c : ${cities}" th:value="${c.id}" th:text="${c.name}"></option>
                    </select>
                    <p class="form-error" th:if="${#fields.hasErrors('cityId')}" th:errors="*{cityId}"></p>
                </div>
            </div>

            <div class="grid grid-cols-1 gap-4 md:grid-cols-3">
                <div>
                    <label class="label">Cena (€) *</label>
                    <input type="number" step="0.01" th:field="*{price}" class="input"/>
                    <p class="form-error" th:if="${#fields.hasErrors('price')}" th:errors="*{price}"></p>
                </div>
                <div>
                    <label class="label">Godina *</label>
                    <input type="number" th:field="*{year}" class="input"/>
                    <p class="form-error" th:if="${#fields.hasErrors('year')}" th:errors="*{year}"></p>
                </div>
                <div>
                    <label class="label">Kilometraža *</label>
                    <input type="number" th:field="*{mileage}" class="input"/>
                    <p class="form-error" th:if="${#fields.hasErrors('mileage')}" th:errors="*{mileage}"></p>
                </div>
            </div>

            <div class="grid grid-cols-1 gap-4 md:grid-cols-3">
                <div>
                    <label class="label">Gorivo *</label>
                    <select th:field="*{fuelType}" class="input">
                        <option value="">-- izaberi --</option>
                        <option th:each="ft : ${fuelTypes}" th:value="${ft}" th:text="${ft.displayName}"></option>
                    </select>
                    <p class="form-error" th:if="${#fields.hasErrors('fuelType')}" th:errors="*{fuelType}"></p>
                </div>
                <div>
                    <label class="label">Menjač *</label>
                    <select th:field="*{transmission}" class="input">
                        <option value="">-- izaberi --</option>
                        <option th:each="t : ${transmissions}" th:value="${t}" th:text="${t.displayName}"></option>
                    </select>
                    <p class="form-error" th:if="${#fields.hasErrors('transmission')}" th:errors="*{transmission}"></p>
                </div>
                <div>
                    <label class="label">Status *</label>
                    <select th:field="*{status}" class="input">
                        <option th:each="s : ${statuses}" th:value="${s}" th:text="${s.displayName}"></option>
                    </select>
                </div>
            </div>

            <div class="grid grid-cols-1 gap-4 md:grid-cols-2">
                <div>
                    <label class="label">Boja</label>
                    <input type="text" th:field="*{color}" class="input"/>
                </div>
                <div>
                    <label class="label">Snaga (kW)</label>
                    <input type="number" th:field="*{enginePower}" class="input"/>
                </div>
            </div>

            <div>
                <label class="label">URL slike</label>
                <input type="text" th:field="*{imageUrl}" placeholder="https://..." class="input"/>
            </div>

            <div>
                <label class="label">Opis</label>
                <textarea th:field="*{description}" rows="4" class="input"></textarea>
            </div>

            <!-- Oprema (ManyToMany) - checkbox lista -->
            <div>
                <label class="label">Oprema</label>
                <div class="grid grid-cols-2 gap-2 md:grid-cols-3">
                    <label th:each="f : ${features}" class="flex items-center gap-2 text-sm">
                        <input type="checkbox" th:field="*{featureIds}" th:value="${f.id}"
                               class="h-4 w-4 rounded border-gray-300"/>
                        <span th:text="${f.name}">Oprema</span>
                    </label>
                </div>
            </div>

            <div class="flex gap-2 border-t border-gray-100 pt-4">
                <button type="submit" class="btn-primary" th:text="${editMode} ? 'Sačuvaj izmene' : 'Objavi oglas'">Sačuvaj</button>
                <a th:href="@{/}" class="btn-secondary">Otkaži</a>
            </div>
        </form>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
</body>
</html>
