# ====== Aplikacija ======
spring.application.name=auto-oglasi
server.port=8080

# ====== Baza: MySQL (default) ======
# createDatabaseIfNotExist automatski kreira semu 'car_ads' ako ne postoji.
# Promeni username/password prema svom MySQL serveru.
spring.datasource.url=jdbc:mysql://localhost:3306/car_ads?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ====== JPA / Hibernate ======
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ====== Thymeleaf ======
spring.thymeleaf.cache=false

# ====== Sesije (upravljanje sesijama - stavka 6) ======
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.name=JSESSIONID

# ====== Upload slika (URL se unosi rucno u ovoj verziji) ======
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
